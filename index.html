<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Mi Amor ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Outfit:wght@300;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff4d6d;
            --secondary: #c9184a;
            --background: #1a0a1a;
            --glass: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--background);
            color: white;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Fondo de estrellas y gradiente */
        .background-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #300d2b 0%, #1a0a1a 100%);
            z-index: -2;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        /* Lluvia de corazones (CSS) */
        .heart-rain {
            position: fixed;
            top: -20px;
            font-size: 20px;
            color: var(--primary);
            user-select: none;
            pointer-events: none;
            animation: fall linear forwards;
            z-index: 0;
        }

        @keyframes fall {
            to {
                transform: translateY(105vh) rotate(360deg);
            }
        }

        /* Carta Glassmorphism */
        .card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5);
            animation: fadeIn 2s ease-out;
            z-index: 10;
            position: relative;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bear-img {
            width: 180px;
            height: auto;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 20px rgba(255, 77, 109, 0.3);
            border: 3px solid var(--primary);
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        .bear-img:hover {
            transform: scale(1.05);
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            color: var(--primary);
            margin-bottom: 20px;
            text-shadow: 0 0 15px rgba(255, 77, 109, 0.5);
        }

        p {
            line-height: 1.6;
            font-size: 1.2rem;
            color: #eee;
            margin-bottom: 20px;
        }

        .messages {
            font-style: italic;
            color: #ffb3c1;
            margin-top: 20px;
            font-size: 1.3rem;
            font-family: 'Dancing Script', cursive;
        }

        .heart-firework-trigger {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 35px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4);
        }

        .heart-firework-trigger:hover {
            background: var(--secondary);
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 20px rgba(255, 77, 109, 0.6);
        }
    </style>
</head>
<body>
    <div class="background-overlay"></div>
    <canvas id="fireworks"></canvas>

    <div class="card">
        <!-- Imagen del osito -->
        <img src="cute_teddy_bear.png" alt="Oso de Amor" class="bear-img" id="bear">
        
        <h1>Para Ti... ❤️</h1>
        
        <p>
            Eres el regalo más hermoso que la vida me ha dado. Cada latido de mi corazón lleva tu nombre, 
            y cada sueño que tengo es mucho más brillante porque tú estás en él. 
        </p>
        
        <div class="messages">
            "Te amo más de lo que las palabras pueden expresar." ✨
        </div>

        <button class="heart-firework-trigger" onclick="createExplosion()">¡Haz Estallar Mi Amor!</button>
    </div>

    <script>
        // 1. Lluvia de Corazones (Rain of Love)
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-rain');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 2 + 3 + 's';
            heart.style.opacity = Math.random() * 0.5 + 0.3;
            heart.style.fontSize = Math.random() * 20 + 15 + 'px';
            
            document.body.appendChild(heart);
            
            setTimeout(() => {
                heart.remove();
            }, 5000);
        }

        setInterval(createHeart, 250);

        // 2. Fuegos Artificiales de Corazones (Heart Fireworks)
        const canvas = document.getElementById('fireworks');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                
                // Parametric heart formula
                const t = Math.random() * Math.PI * 2;
                const force = Math.random() * 4 + 3;
                
                // Scale factor for the heart shape
                const scale = 12;
                
                this.vx = force * (16 * Math.pow(Math.sin(t), 3)) / scale;
                this.vy = -force * (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) / scale;
                
                this.life = 1;
                this.opacity = 1;
                this.size = Math.random() * 2 + 1;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.04; // Gravity
                this.life -= 0.008;
                this.opacity = this.life;
            }

            draw() {
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function createExplosion(x, y) {
            const colors = ['#ff4d6d', '#ff758f', '#ff8fa3', '#ffb3c1', '#ffffff'];
            const startX = x || Math.random() * (canvas.width * 0.8) + (canvas.width * 0.1);
            const startY = y || Math.random() * (canvas.height * 0.6) + (canvas.height * 0.1);
            const color = colors[Math.floor(Math.random() * colors.length)];

            for (let i = 0; i < 60; i++) {
                particles.push(new Particle(startX, startY, color));
            }
        }

        // Automatic fireworks occasionally
        setInterval(() => createExplosion(), 2500);

        function animate() {
            // Slight trail effect
            ctx.fillStyle = 'rgba(26, 10, 26, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            particles = particles.filter(p => p.life > 0);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }

        animate();

        // Interaction with the bear
        document.getElementById('bear').addEventListener('click', (e) => {
            for(let i =0; i < 3; i++) {
                setTimeout(() => {
                    createExplosion(e.clientX + (Math.random()-0.5)*50, e.clientY + (Math.random()-0.5)*50);
                }, i * 100);
            }
        });
    </script>
</body>
</html>
